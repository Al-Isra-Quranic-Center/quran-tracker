<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز الإسراء القرآني - متابعة الحفظ</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1b4332;
            --secondary-color: #2d6a4f;
            --accent-color: #d4af37;
            --bg-color: #f8f9fa;
            --text-color: #212529;
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        header {
            text-align: center;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        h1 {
            color: var(--primary-color);
            margin: 0 0 10px 0;
        }
        .status-bar {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }
        .status-online { background-color: #d4edda; color: #155724; }
        .status-offline { background-color: #f8d7da; color: #721c24; }
        .card {
            background: #fff;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        input, button, select {
            font-family: 'Tajawal', sans-serif;
            padding: 10px 14px;
            margin: 5px 0;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 1em;
        }
        button {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: var(--primary-color);
        }
        .admin-section {
            display: none;
            background: #f1f8f5;
            border-right: 4px solid var(--secondary-color);
        }
    </style>

    <!-- Firebase SDK v9 (Modular Imports via ES Modules) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        // إعدادات Firebase الحقيقية الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyB-FD_xhkWXsUujfB1KT91S1YLvxYvXbvA",
            authDomain: "quran-tracker-73ae0.firebaseapp.com",
            projectId: "quran-tracker-73ae0",
            storageBucket: "quran-tracker-73ae0.firebasestorage.app",
            messagingSenderId: "394580178177",
            appId: "1:394580178177:web:c195fa68c288df767b1700"
        };

        // تهيئة التطبيق والقاعدة
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const docRef = doc(db, "quranTracker", "data");

        // كلمة مرور المسؤول (PIN) المحددة
        const ADMIN_PIN = "1234";

        window.checkAdminPin = function() {
            const inputPin = document.getElementById("adminPinInput").value;
            const errorElement = document.getElementById("loginError");
            if (inputPin === ADMIN_PIN) {
                document.getElementById("adminPanel").style.display = "block";
                document.getElementById("loginSection").style.display = "none";
                errorElement.innerText = "";
            } else {
                errorElement.innerText = "رمز الدخول غير صحيح! جرب 1234";
            }
        };

        // الاستماع للتحديثات الحية تلقائياً
        onSnapshot(docRef, (docSnap) => {
            const statusEl = document.getElementById("connectionStatus");
            if (docSnap.exists()) {
                statusEl.className = "status-bar status-online";
                statusEl.innerText = "متصل ومتزامن مباشرة ✓";
                const data = docSnap.data();
                if(data.content) {
                    document.getElementById("trackerContent").innerHTML = data.content;
                }
            } else {
                statusEl.className = "status-bar status-online";
                statusEl.innerText = "جاهز للبدء (قاعدة البيانات نشطة)";
                // إنشاء المستند الأولي
                setDoc(docRef, { content: "<p>مرحباً بكم في نظام متابعة حفظ القرآن الكريم - مركز الإسراء القرآني</p>" });
            }
        }, (error) => {
            const statusEl = document.getElementById("connectionStatus");
            statusEl.className = "status-bar status-offline";
            statusEl.innerText = "خطأ في الاتصال بقاعدة البيانات";
            console.error("Firestore Error:", error);
        });

        window.saveData = async function() {
            const newContent = document.getElementById("adminContentInput").value;
            try {
                await setDoc(docRef, { content: `<p>${newContent}</p>` }, { merge: true });
                alert("تم حفظ البيانات وتحديثها فوراً للجميع!");
            } catch (e) {
                alert("حدث خطأ أثناء الحفظ: " + e.message);
            }
        };
    </script>
</head>
<body>

<div class="container">
    <header>
        <h1>مركز الإسراء القرآني</h1>
        <p>نظام متابعة وتثبيت حفظ القرآن الكريم</p>
        <div id="connectionStatus" class="status-bar status-offline">جاري الاتصال...</div>
    </header>

    <!-- عرض البيانات للطلاب والمشرفين -->
    <div class="card">
        <h3>جدول المتابعة والحفظ</h3>
        <div id="trackerContent">جاري تحميل البيانات...</div>
    </div>

    <!-- تسجيل دخول المسؤول -->
    <div id="loginSection" class="card">
        <h3>دخول المسؤول</h3>
        <input type="password" id="adminPinInput" placeholder="أدخل رمز الدخول (1234)">
        <button onclick="checkAdminPin()">تسجيل الدخول</button>
        <p id="loginError" style="color: red; margin-top: 5px;"></p>
    </div>

    <!-- لوحة التحكم بالمسؤول -->
    <div id="adminPanel" class="card admin-section">
        <h3>لوحة تحكم المسؤول - تعديل المحتوى</h3>
        <textarea id="adminContentInput" rows="4" style="width: 95%; margin-bottom: 10px;" placeholder="اكتب التحديث الجديد للمتابعة هنا..."></textarea>
        <br>
        <button onclick="saveData()">نشر وتحديث البيانات</button>
    </div>
</div>

</body>
</html>
