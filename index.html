<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مركز الإسراء القرآني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F6F1;
    --surface:#FFFFFF;
    --ink:#1C2620;
    --muted:#6B7568;
    --primary:#123524;
    --primary-light:#1F5C3E;
    --gold:#B8862E;
    --gold-soft:#F1E4C4;
    --border:#E1E3DC;
    --danger:#A8412B;
    --danger-soft:#F6E4DF;
    --done:#1F5C3E;
    --done-soft:#DEEBE3;
    --progress-c:#B8862E;
    --progress-soft:#F5EAD3;
    --notstarted:#98A093;
    --notstarted-soft:#EEEFEA;
    --radius:14px;
    --shadow:0 1px 2px rgba(18,53,36,.06), 0 8px 24px -12px rgba(18,53,36,.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
    line-height:1.6;
  }
  h1,h2,h3,.display{
    font-family:'Amiri',serif;
    font-weight:700;
    margin:0;
  }
  button, input, select{
    font-family:inherit;
    font-size:15px;
  }
  a{color:inherit;}

  /* header */
  .topbar{
    background:var(--primary);
    color:#fff;
    padding:16px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .brand svg{flex:none;}
  .brand-text .display{font-size:22px;color:#fff;}
  .brand-text small{color:var(--gold-soft);font-size:12.5px;letter-spacing:.3px;}
  .topbar nav{display:flex;gap:8px;flex-wrap:wrap;}
  .topbar button{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.25);
    color:#fff;
    padding:8px 16px;
    border-radius:999px;
    cursor:pointer;
    transition:background .15s;
  }
  .topbar button:hover{background:rgba(255,255,255,.18);}
  .topbar button.primary-cta{
    background:var(--gold);
    border-color:var(--gold);
    color:#241a06;
    font-weight:700;
  }

  main{
    max-width:980px;
    margin:0 auto;
    padding:32px 20px 80px;
  }

  /* Home */
  .hero{
    text-align:center;
    padding:48px 12px 36px;
  }
  .hero-icon{margin-bottom:18px;}
  .hero h1{font-size:34px;color:var(--primary);}
  .hero p{color:var(--muted);max-width:480px;margin:12px auto 0;font-size:15.5px;}
  .choice-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
    margin-top:36px;
  }
  @media(max-width:640px){.choice-grid{grid-template-columns:1fr;}}
  .choice-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:28px 22px;
    text-align:right;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:transform .15s, border-color .15s;
  }
  .choice-card:hover{transform:translateY(-2px);border-color:var(--primary-light);}
  .choice-card .ico{
    width:44px;height:44px;border-radius:10px;
    background:var(--done-soft);color:var(--primary);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:14px;
  }
  .choice-card h3{font-size:19px;color:var(--ink);margin-bottom:6px;}
  .choice-card p{color:var(--muted);font-size:14px;margin:0;}
  .honor-link{
    display:inline-flex;align-items:center;gap:6px;
    margin-top:28px;color:var(--primary);font-weight:700;
    text-decoration:none;border-bottom:2px solid var(--gold);
    padding-bottom:2px;cursor:pointer;background:none;border-top:none;border-left:none;border-right:none;font-size:15px;
  }

  /* Cards / sections */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:22px;
    box-shadow:var(--shadow);
    margin-bottom:18px;
  }
  .section-head{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;margin-bottom:16px;flex-wrap:wrap;
  }
  .section-head h2{font-size:21px;color:var(--primary);}
  .section-head .sub{color:var(--muted);font-size:13.5px;margin-top:2px;font-family:'Tajawal',sans-serif;font-weight:400;}
  .btn{
    background:var(--primary);
    color:#fff;
    border:none;
    padding:10px 18px;
    border-radius:10px;
    cursor:pointer;
    font-weight:700;
    font-size:14.5px;
  }
  .btn:hover{background:var(--primary-light);}
  .btn.secondary{background:var(--surface);color:var(--primary);border:1.5px solid var(--primary);}
  .btn.secondary:hover{background:var(--done-soft);}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
  .btn.danger{background:var(--danger);}
  .btn.danger:hover{background:#8c3421;}
  .btn.small{padding:6px 12px;font-size:13px;border-radius:8px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13.5px;color:var(--muted);margin-bottom:5px;font-weight:500;}
  .field input, .field select{
    width:100%;
    padding:10px 12px;
    border:1.5px solid var(--border);
    border-radius:9px;
    background:#fff;
    color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:2px solid var(--primary-light);outline-offset:1px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:560px){.row2{grid-template-columns:1fr;}}

  .breadcrumb{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13.5px;margin-bottom:16px;flex-wrap:wrap;}
  .breadcrumb a{cursor:pointer;color:var(--primary);text-decoration:underline;}

  .list-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 4px;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap;
  }
  .list-row:last-child{border-bottom:none;}
  .list-row .meta{color:var(--muted);font-size:13px;}
  .name-btn{background:none;border:none;padding:0;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer;text-align:right;}
  .name-btn:hover{color:var(--primary);}

  .pill{
    display:inline-block;padding:3px 11px;border-radius:999px;font-size:12.5px;font-weight:700;
  }
  .pill.done{background:var(--done-soft);color:var(--done);}
  .pill.progress{background:var(--progress-soft);color:var(--progress-c);}
  .pill.notstarted{background:var(--notstarted-soft);color:var(--notstarted);}

  .stat-strip{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
  .stat{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 20px;flex:1;min-width:130px;box-shadow:var(--shadow);
  }
  .stat .num{font-family:'Amiri',serif;font-size:28px;color:var(--primary);font-weight:700;}
  .stat .lbl{color:var(--muted);font-size:12.5px;margin-top:2px;}

  table{width:100%;border-collapse:collapse;}
  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;}
  th,td{padding:10px 12px;text-align:right;font-size:14px;border-bottom:1px solid var(--border);white-space:nowrap;}
  thead th{background:var(--bg);color:var(--muted);font-weight:700;font-size:12.5px;position:sticky;top:0;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FAFAF7;}
  td select, td input{padding:6px 8px;border-radius:7px;border:1.3px solid var(--border);font-size:13.5px;}
  .search-box{margin-bottom:12px;}

  .empty{
    text-align:center;color:var(--muted);padding:36px 12px;font-size:14.5px;
  }
  .msg{padding:10px 14px;border-radius:9px;font-size:14px;margin-bottom:14px;}
  .msg.error{background:var(--danger-soft);color:var(--danger);}
  .msg.ok{background:var(--done-soft);color:var(--done);}

  .top3{display:flex;gap:12px;flex-wrap:wrap;}
  .top3 .slot{
    flex:1;min-width:150px;background:var(--gold-soft);border-radius:12px;padding:14px;text-align:center;
  }
  .top3 .slot .rank{font-family:'Amiri',serif;font-size:22px;color:var(--gold);font-weight:700;}
  .top3 .slot .nm{font-weight:700;margin-top:4px;}

  .round-card{border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;}
  .round-card .rdate{color:var(--muted);font-size:13px;margin-bottom:10px;}

  footer.tip{
    text-align:center;color:var(--muted);font-size:12.5px;margin-top:40px;
  }
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(18,53,36,.45);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;
  }
  .modal{
    background:#fff;border-radius:var(--radius);padding:24px;max-width:420px;width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
  }
  .modal h3{margin-bottom:14px;color:var(--primary);}
  .modal-actions{display:flex;gap:10px;margin-top:16px;justify-content:flex-start;}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 48 48" fill="none">
      <path d="M24 4C15 10 10 18 10 27c0 8 6 15 14 17 8-2 14-9 14-17 0-9-5-17-14-23Z" fill="#B8862E" opacity=".9"/>
      <path d="M24 10c-6 4.5-9.5 10.5-9.5 17 0 6 4 11.3 9.5 13 5.5-1.7 9.5-7 9.5-13 0-6.5-3.5-12.5-9.5-17Z" fill="#123524"/>
    </svg>
    <div class="brand-text">
      <div class="display">مركز الإسراء القرآني</div>
      <small id="groupNameTag">نظام حفظ القرآن الكريم</small>
    </div>
  </div>
  <nav id="topnav"></nav>
</div>
<main id="main"></main>
<footer class="tip" id="footTip">جاري الاتصال بقاعدة البيانات...</footer>

<script type="module">
/* ============================================================
   إعداد Firebase — عدّل القيم الخمس/الست التالية فقط
   خذها من: console.firebase.google.com > إعدادات المشروع > تطبيقات الويب
   ============================================================ */
import { initializeApp, deleteApp } from 'https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js';
import { getFirestore, doc, collection, onSnapshot, setDoc, getDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js';
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, updatePassword } from 'https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js';

const firebaseConfig = {
    apiKey: "AIzaSyB-FD_xhkWXsUujfB1KT91S1YLvxYvXbvA",
    authDomain: "quran-tracker-73ae0.firebaseapp.com",
    projectId: "quran-tracker-73ae0",
    storageBucket: "quran-tracker-73ae0.firebasestorage.app",
    messagingSenderId: "394580178177",
    appId: "1:394580178177:web:c195fa68c288df767b1700"
  };
/* ============================================================ */

/* ---------- Data ---------- */
const SURAHS = [
["الفاتحة",7],["البقرة",286],["آل عمران",200],["النساء",176],["المائدة",120],["الأنعام",165],
["الأعراف",206],["الأنفال",75],["التوبة",129],["يونس",109],["هود",123],["يوسف",111],
["الرعد",43],["إبراهيم",52],["الحجر",99],["النحل",128],["الإسراء",111],["الكهف",110],
["مريم",98],["طه",135],["الأنبياء",112],["الحج",78],["المؤمنون",118],["النور",64],
["الفرقان",77],["الشعراء",227],["النمل",93],["القصص",88],["العنكبوت",69],["الروم",60],
["لقمان",34],["السجدة",30],["الأحزاب",73],["سبأ",54],["فاطر",45],["يس",83],
["الصافات",182],["ص",88],["الزمر",75],["غافر",85],["فصلت",54],["الشورى",53],
["الزخرف",89],["الدخان",59],["الجاثية",37],["الأحقاف",35],["محمد",38],["الفتح",29],
["الحجرات",18],["ق",45],["الذاريات",60],["الطور",49],["النجم",62],["القمر",55],
["الرحمن",78],["الواقعة",96],["الحديد",29],["المجادلة",22],["الحشر",24],["الممتحنة",13],
["الصف",14],["الجمعة",11],["المنافقون",11],["التغابن",18],["الطلاق",12],["التحريم",12],
["الملك",30],["القلم",52],["الحاقة",52],["المعارج",44],["نوح",28],["الجن",28],
["المزمل",20],["المدثر",56],["القيامة",40],["الإنسان",31],["المرسلات",50],["النبأ",40],
["النازعات",46],["عبس",42],["التكوير",29],["الإنفطار",19],["المطففين",36],["الإنشقاق",25],
["البروج",22],["الطارق",17],["الأعلى",19],["الغاشية",26],["الفجر",30],["البلد",20],
["الشمس",15],["الليل",21],["الضحى",11],["الشرح",8],["التين",8],["العلق",19],
["القدر",5],["البينة",8],["الزلزلة",8],["العاديات",11],["القارعة",11],["التكاثر",8],
["العصر",3],["الهمزة",9],["الفيل",5],["قريش",4],["الماعون",7],["الكوثر",3],
["الكافرون",6],["النصر",3],["المسد",5],["الإخلاص",4],["الفلق",5],["الناس",6]
].map((s,i)=>({idx:i, name:s[0], ayat:s[1]}));

const GRADES = ["ممتاز","جيد جدًا","جيد","مقبول","ضعيف"];
const STATUS = {not_started:"لم يبدأ", in_progress:"تحت الحفظ", done:"تم الحفظ"};

/* ---------- Store (Firebase Firestore — مباشر ومتزامن بين كل الأجهزة) ---------- */
const SEED_DB = { groups:[], rounds:[] };
const EMAIL_DOMAIN = "@quran-tracker.app"; // نحوّل اسم المستخدم إلى بريد وهمي يفهمه Firebase Auth
function usernameToEmail(u){ return u.trim().toLowerCase().replace(/\s+/g,"")+EMAIL_DOMAIN; }

let db = null;
let firestoreReady = false;
let firestoreErr = null;
let fsDocRef = null;
let fsInstance = null;
let authInstance = null;
let authRestoring = true;   // true حتى يخبرنا Firebase إن كان في جلسة محفوظة
let adminsList = [];        // {uid, username, name} — من مجموعة admins (سماح/صلاحيات)

function isConfigured(){
  return firebaseConfig.apiKey && !String(firebaseConfig.apiKey).includes("ضع_");
}

function initFirebase(){
  if(!isConfigured()){ render(); return; }
  try{
    const app = initializeApp(firebaseConfig);
    fsInstance = getFirestore(app);
    authInstance = getAuth(app);
    fsDocRef = doc(fsInstance, "quranTracker", "data");

    onSnapshot(fsDocRef, snap=>{
      if(snap.exists()){
        db = snap.data();
      } else {
        db = JSON.parse(JSON.stringify(SEED_DB));
        setDoc(fsDocRef, db).catch(()=>{});
      }
      firestoreReady = true; firestoreErr = null;
      render();
    }, err=>{
      firestoreErr = err && err.message ? err.message : "تعذّر الاتصال";
      render();
    });

    onSnapshot(collection(fsInstance,"admins"), snap=>{
      adminsList = snap.docs.map(d=>({uid:d.id, ...d.data()}));
      render();
    });

    onAuthStateChanged(authInstance, async user=>{
      authRestoring = false;
      if(user){
        const aSnap = await getDoc(doc(fsInstance,"admins",user.uid));
        if(aSnap.exists()){
          state.adminUser = {uid:user.uid, username:aSnap.data().username, name:aSnap.data().name};
        } else {
          // حساب مسجّل بـ Firebase لكن بلا صلاحية مسؤول (مثلاً أُزيلت صلاحيته) — سجّل خروجه
          state.adminUser = null;
          if(user) signOut(authInstance).catch(()=>{});
        }
      } else {
        state.adminUser = null;
      }
      render();
    });
  }catch(e){
    firestoreErr = e && e.message ? e.message : "تعذّر إعداد Firebase";
    render();
  }
}

function save(){
  if(!fsDocRef || !db) return;
  setDoc(fsDocRef, db).catch(e=> console.error("save failed", e));
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ---------- App state ---------- */
let state = { view:"home", adminUser:null, groupId:null, studentId:null, publicPass:null, err:null };

function go(view, extra){ state = Object.assign({view, err:null}, extra||{}, {adminUser:state.adminUser}); render(); }

function studentStats(student){
  let done=0, inprog=0, notstarted=0;
  SURAHS.forEach(s=>{
    const st = (student.progress && student.progress[s.idx]) ? student.progress[s.idx].status : "not_started";
    if(st==="done") done++; else if(st==="in_progress") inprog++; else notstarted++;
  });
  return {done, inprog, notstarted};
}

/* ---------- Render root ---------- */
function render(){
  renderNav();
  updateFootTip();
  const m = document.getElementById("main");
  m.innerHTML = "";

  if(!isConfigured()){ m.innerHTML = setupScreenHTML(); return; }
  if(firestoreErr){ m.innerHTML = errorScreenHTML(); return; }
  if(!firestoreReady || authRestoring){ m.innerHTML = `<div class="card empty">جاري تحميل البيانات من قاعدة البيانات المباشرة...</div>`; return; }

  const view = {
    home: renderHome,
    honor: renderHonor,
    publicGroups: renderPublicGroups,
    publicStudents: renderPublicStudents,
    publicPassword: renderPublicPassword,
    publicReport: renderPublicReport,
    adminLogin: renderAdminLogin,
    adminHome: renderAdminHome,
    adminGroup: renderAdminGroup,
    adminStudent: renderAdminStudent,
    adminRounds: renderAdminRounds,
    adminAdmins: renderAdminAdmins,
  }[state.view] || renderHome;
  view(m);
}

function renderNav(){
  const nav = document.getElementById("topnav");
  nav.innerHTML = "";
  if(state.view!=="home"){
    const home = document.createElement("button");
    home.textContent = "الرئيسية";
    home.onclick = ()=>go("home");
    nav.appendChild(home);
  }
  if(state.adminUser){
    const dash = document.createElement("button");
    dash.textContent = "لوحة المسؤول";
    dash.onclick = ()=>go("adminHome");
    nav.appendChild(dash);
    const out = document.createElement("button");
    out.textContent = "تسجيل الخروج ("+state.adminUser.name+")";
    out.className="primary-cta";
    out.onclick = ()=>{ signOut(authInstance).catch(()=>{}); state.adminUser=null; go("home"); };
    nav.appendChild(out);
  } else if(state.view!=="adminLogin"){
    const login = document.createElement("button");
    login.textContent = "دخول المسؤولين";
    login.onclick = ()=>go("adminLogin");
    nav.appendChild(login);
  }
}

function updateFootTip(){
  const el = document.getElementById("footTip");
  if(!el) return;
  if(!isConfigured()) el.textContent = "لم يتم إعداد قاعدة البيانات بعد — أكمل الخطوات في الأعلى.";
  else if(firestoreErr) el.textContent = "تعذّر الاتصال بقاعدة البيانات: "+firestoreErr;
  else if(!firestoreReady) el.textContent = "جاري الاتصال بقاعدة البيانات...";
  else el.textContent = "متصل ومتزامن مباشرة عبر الإنترنت ✓ — البيانات مشتركة بين كل الأجهزة.";
}

function setupScreenHTML(){
  return `
    <div class="card" style="max-width:600px;margin:30px auto;">
      <div class="section-head"><h2>خطوة إعداد لمرة واحدة</h2></div>
      <p style="color:var(--muted);font-size:14.5px;">
        هذا الملف جاهز ليعمل بشكل مباشر (Live) عبر الإنترنت مع حماية دخول حقيقية، لكن ينقصه ربطه بمشروع Firebase.
        افتح ملف الصفحة بمحرر نصوص، ابحث عن <code>firebaseConfig</code> بأعلى الكود، واستبدل القيم الست
        بالقيم التي تحصل عليها من مشروعك على Firebase، ثم فعّل تسجيل الدخول بالبريد/كلمة السر وأنشئ أول حساب مسؤول
        (اتبع الخطوات الكاملة التي أرسلتها لك في المحادثة).
      </p>
      <p style="color:var(--muted);font-size:14.5px;">بعد التعديل، احفظ الملف وأعد فتحه — سيتصل تلقائيًا.</p>
    </div>
  `;
}

function errorScreenHTML(){
  return `
    <div class="card msg error" style="max-width:560px;margin:30px auto;">
      تعذّر الاتصال بقاعدة البيانات: ${esc(firestoreErr)}<br>

function exportBackup(){
  const blob = new Blob([JSON.stringify(db,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download="quran-tracker-backup-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function importBackup(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data.groups) throw new Error("bad");
      if(confirm("سيتم استبدال بيانات المجموعات والطلاب والدورات الحالية بالكامل بالنسخة المستوردة (حسابات المسؤولين لا تتأثر). متابعة؟")){
        db = {groups:data.groups||[], rounds:data.rounds||[]}; save(); go("adminHome");
      }
    }catch(err){ alert("ملف غير صالح."); }
  };
  reader.readAsText(file);
}

function fillEditTable(m, g, s, filter){
  const tbody = m.querySelector("#editTable tbody");
  tbody.innerHTML="";
  const f=(filter||"").trim();
  SURAHS.filter(sur=> !f || sur.name.includes(f)).forEach(sur=>{
    if(!s.progress) s.progress={};
    const p = s.progress[sur.idx] || {status:"not_started", ayah:"", grade:""};
    const tr=document.createElement("tr");
    tr.innerHTML = `
      <td>${esc(sur.name)}</td>
      <td>${sur.ayat}</td>
      <td>
        <select data-role="status">
          <option value="not_started" ${p.status==="not_started"?"selected":""}>لم يبدأ</option>
          <option value="in_progress" ${p.status==="in_progress"?"selected":""}>تحت الحفظ</option>
          <option value="done" ${p.status==="done"?"selected":""}>تم الحفظ</option>
        </select>
      </td>
      <td><input data-role="ayah" type="number" min="1" max="${sur.ayat}" style="width:70px;" value="${p.status==="in_progress"?(p.ayah||""):""}" ${p.status!=="in_progress"?"disabled":""}></td>
      <td>
        <select data-role="grade">
          <option value="">—</option>
          ${GRADES.map(gr=>`<option value="${gr}" ${p.grade===gr?"selected":""}>${gr}</option>`).join("")}
        </select>
      </td>
    `;
    const statusSel = tr.querySelector('[data-role="status"]');
    const ayahIn = tr.querySelector('[data-role="ayah"]');
    const gradeSel = tr.querySelector('[data-role="grade"]');
    const update = ()=>{
      const status = statusSel.value;
      s.progress[sur.idx] = {
        status,
        ayah: status==="in_progress" ? (ayahIn.value||"") : "",
        grade: gradeSel.value
      };
      ayahIn.disabled = status!=="in_progress";
      if(status!=="in_progress") ayahIn.value="";
      save();
    };
    statusSel.onchange=update;
    ayahIn.onchange=update;
    gradeSel.onchange=update;
    tbody.appendChild(tr);
  });
}

    </div>`;
  document.body.appendChild(back);
  back.querySelector("#mCancel").onclick=()=>back.remove();
  back.querySelector("#mSave").onclick=()=>{
    s.name = back.querySelector("#mName").value.trim() || s.name;
    s.joinDate = back.querySelector("#mDate").value;
    s.password = back.querySelector("#mPass").value.trim() || s.password;
    save(); back.remove(); go("adminStudent",{groupId:g.id, studentId:s.id});
  };
}

/* ---------- Admin rounds ---------- */
function renderAdminRounds(m){
  if(!state.adminUser){ go("adminLogin"); return; }
  const allStudents = [];
  db.groups.forEach(g=> g.students.forEach(s=> allStudents.push(s.name)));
  m.innerHTML = `
    <div class="breadcrumb"><a id="bHome">لوحة المسؤول</a> / إدارة الدورات</div>
    <div class="section-head"><div><h2>دورات الأوائل</h2><div class="sub">سجّل أوائل كل دورة يدويًا</div></div></div>
    <div class="card">
      <div class="row2">
        <div class="field"><label>اسم الدورة</label><input id="rName" placeholder="مثال: دورة الفصل الأول"></div>
        <div class="field"><label>التاريخ</label><input id="rDate" type="date"></div>
      </div>
      <div class="row2" style="grid-template-columns:1fr 1fr 1fr;">
        <div class="field"><label>الأول</label><input id="r1" list="studNames"></div>
        <div class="field"><label>الثاني</label><input id="r2" list="studNames"></div>
        <div class="field"><label>الثالث</label><input id="r3" list="studNames"></div>
      </div>
      <datalist id="studNames">${allStudents.map(n=>`<option value="${escAttr(n)}">`).join("")}</datalist>
      <button class="btn" id="addRound">إضافة الدورة</button>
    </div>
    <div id="roundsAdminList"></div>
  `;
  m.querySelector("#bHome").onclick=()=>go("adminHome");
  m.querySelector("#addRound").onclick=()=>{
    const name = m.querySelector("#rName").value.trim();
    if(!name){ alert("اسم الدورة مطلوب."); return; }
    db.rounds.push({
      id:uid(), name,
      date:m.querySelector("#rDate").value,
      top:[m.querySelector("#r1").value.trim(), m.querySelector("#r2").value.trim(), m.querySelector("#r3").value.trim()]
    });
    save(); go("adminRounds");
  };
  const list = m.querySelector("#roundsAdminList");
  const rounds = [...db.rounds].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  if(rounds.length===0){ list.innerHTML=`<div class="card empty">لا توجد دورات بعد.</div>`; }
  rounds.forEach(r=>{
    const el=document.createElement("div");
    el.className="card round-card";
    el.innerHTML=`
      <div class="section-head" style="margin-bottom:8px;">
        <h3 style="color:var(--primary);font-size:16.5px;">${esc(r.name)}</h3>
        <button class="btn ghost small" data-del>حذف</button>
      </div>
      <div class="rdate">${esc(r.date||"")}</div>
      <div class="top3">
        ${["الأول","الثاني","الثالث"].map((lbl,i)=>`<div class="slot"><div class="rank">${lbl}</div><div class="nm">${esc(r.top[i]||"—")}</div></div>`).join("")}
      </div>
    `;
    el.querySelector("[data-del]").onclick=()=>{
      if(confirm("حذف هذه الدورة؟")){ db.rounds=db.rounds.filter(x=>x.id!==r.id); save(); go("adminRounds"); }
    };
    list.appendChild(el);
  });
}

/* ---------- Admin: manage admins ---------- */
function renderAdminAdmins(m){
  if(!state.adminUser){ go("adminLogin"); return; }
  m.innerHTML = `
    <div class="breadcrumb"><a id="bHome">لوحة المسؤول</a> / إدارة المسؤولين</div>
    <div class="section-head"><div><h2>حسابات المسؤولين</h2><div class="sub">محمية بتسجيل دخول حقيقي عبر Firebase — كل مسؤول له حساب وكلمة سر خاصة فيه</div></div></div>

    <div class="card">
      <div class="section-head" style="margin-bottom:10px;"><h3 style="font-size:16px;color:var(--primary);">تغيير كلمة سري</h3></div>
      ${state.pwMsg? `<div class="msg ${state.pwErr?'error':'ok'}">${esc(state.pwMsg)}</div>`:""}
      <div class="row2">
        <div class="field"><label>كلمة سر جديدة</label><input id="myNewPass" type="password"></div>
        <div class="field" style="display:flex;align-items:end;"><button class="btn secondary" id="changePass" style="width:100%;">تحديث كلمة السر</button></div>
      </div>
    </div>

    <div class="card">
      <div class="section-head" style="margin-bottom:10px;"><h3 style="font-size:16px;color:var(--primary);">إضافة مسؤول جديد</h3></div>
      ${state.addAdmErr? `<div class="msg error">${esc(state.addAdmErr)}</div>`:""}
      <div class="row2">
        <div class="field"><label>الاسم الظاهر</label><input id="aName"></div>
        <div class="field"><label>اسم المستخدم</label><input id="aUser"></div>
      </div>
      <div class="row2">
        <div class="field"><label>كلمة السر (6 أحرف فأكثر)</label><input id="aPass"></div>
        <div class="field" style="display:flex;align-items:end;"><button class="btn" id="addAdm" style="width:100%;" ${state.busy?"disabled":""}>${state.busy?"جاري الإضافة...":"إضافة مسؤول"}</button></div>
      </div>
    </div>
    <div class="card" id="admList"></div>
  `;
  m.querySelector("#bHome").onclick=()=>go("adminHome");

  m.querySelector("#changePass").onclick=async ()=>{
    const np = m.querySelector("#myNewPass").value;
    if(!np || np.length<6){ state.pwErr=true; state.pwMsg="كلمة السر يجب أن تكون 6 أحرف على الأقل."; render(); return; }
    try{
      await updatePassword(authInstance.currentUser, np);
      state.pwErr=false; state.pwMsg="تم تحديث كلمة السر بنجاح.";
    }catch(err){
      state.pwErr=true;
      state.pwMsg = err.code==="auth/requires-recent-login"
        ? "لأسباب أمنية، سجّل خروج وادخل من جديد ثم أعد المحاولة فورًا."
        : "تعذّر تحديث كلمة السر.";
    }
    render();
  };

  m.querySelector("#addAdm").onclick=async ()=>{
    const name=m.querySelector("#aName").value.trim();
    const user=m.querySelector("#aUser").value.trim();
    const pass=m.querySelector("#aPass").value;
    state.addAdmErr=null;
    if(!name||!user||!pass){ state.addAdmErr="جميع الحقول مطلوبة."; render(); return; }
    if(pass.length<6){ state.addAdmErr="كلمة السر يجب أن تكون 6 أحرف على الأقل."; render(); return; }
    if(adminsList.some(a=>a.username===user)){ state.addAdmErr="اسم المستخدم موجود مسبقًا."; render(); return; }
    state.busy=true; render();
    // ننشئ الحساب على "تطبيق فرعي" مؤقت حتى لا يتم تسجيل خروجك أنت واستبدالك بالحساب الجديد
    const secondaryApp = initializeApp(firebaseConfig, "secondary-"+Date.now());
    const secondaryAuth = getAuth(secondaryApp);
    try{
      const cred = await createUserWithEmailAndPassword(secondaryAuth, usernameToEmail(user), pass);
      const newUid = cred.user.uid;
      await signOut(secondaryAuth);
      await setDoc(doc(fsInstance,"admins",newUid), {username:user, name});
    }catch(err){
      state.addAdmErr = err.code==="auth/email-already-in-use" ? "اسم المستخدم مستخدم مسبقًا." : "تعذّر إنشاء الحساب.";
    }finally{
      await deleteApp(secondaryApp).catch(()=>{});
      state.busy=false; render();
    }
  };

  const list = m.querySelector("#admList");
  if(adminsList.length===0){ list.innerHTML = `<div class="empty">لا يوجد مسؤولون بعد.</div>`; }
  adminsList.forEach(a=>{
    const row=document.createElement("div");
    row.className="list-row";
    row.innerHTML=`
      <div><b>${esc(a.name)}</b><div class="meta">${esc(a.username)}</div></div>
      <button class="btn ghost small" data-del ${adminsList.length<=1?"disabled":""}>إزالة الصلاحية</button>
    `;
    row.querySelector("[data-del]").onclick=async ()=>{
      if(adminsList.length<=1) return;
      if(confirm(`إزالة صلاحية المسؤول عن "${a.name}"؟ لن يعود بإمكانه الدخول للوحة المسؤول.`)){
        await deleteDoc(doc(fsInstance,"admins",a.uid)).catch(()=>{});
        if(state.adminUser.uid===a.uid){ signOut(authInstance).catch(()=>{}); go("home"); }
      }
    };
    list.appendChild(row);
  });
}

/* ---------- utils ---------- */
function esc(str){ return String(str==null?"":str).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function escAttr(str){ return esc(str); }

initFirebase();
render();
</script>
</body>
</html>
